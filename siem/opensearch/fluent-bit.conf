# Ships the proxy's JSON-lines logs to OpenSearch (one index per file; rotated .N files are not read).
[SERVICE]
    Flush        1
    Parsers_File parsers.conf
    Log_Level    warn

[INPUT]
    Name             tail
    Path             /logs/webfilter.jsonl
    Tag              wf.requests
    Parser           webfilter_json
    Read_from_Head   On
    DB               /tmp/wf-requests.db
[INPUT]
    Name             tail
    Path             /logs/webfilter_system.jsonl
    Tag              wf.system
    Parser           webfilter_json
    Read_from_Head   On
    DB               /tmp/wf-system.db
[INPUT]
    Name             tail
    Path             /logs/webfilter_stats.jsonl
    Tag              wf.stats
    Parser           webfilter_json
    Read_from_Head   On
    DB               /tmp/wf-stats.db
[INPUT]
    Name             tail
    Path             /logs/webfilter_admin.jsonl
    Tag              wf.admin
    Parser           webfilter_json
    Read_from_Head   On
    DB               /tmp/wf-admin.db
[INPUT]
    Name             tail
    Path             /logs/webfilter_access.jsonl
    Tag              wf.access
    Parser           webfilter_json
    Read_from_Head   On
    DB               /tmp/wf-access.db

[OUTPUT]
    Match              wf.requests
    Index              webfilter-requests
    Name               opensearch
    Host               node-0.example.com
    Port               9200
    HTTP_User          admin
    HTTP_Passwd        ${OPENSEARCH_PASSWORD}
    tls                On
    tls.verify         On
    tls.ca_file        /certs/root-ca.pem
    Logstash_Format    Off
    Suppress_Type_Name On
    Retry_Limit        5
[OUTPUT]
    Match              wf.system
    Index              webfilter-system
    Name               opensearch
    Host               node-0.example.com
    Port               9200
    HTTP_User          admin
    HTTP_Passwd        ${OPENSEARCH_PASSWORD}
    tls                On
    tls.verify         On
    tls.ca_file        /certs/root-ca.pem
    Logstash_Format    Off
    Suppress_Type_Name On
    Retry_Limit        5
[OUTPUT]
    Match              wf.stats
    Index              webfilter-stats
    Name               opensearch
    Host               node-0.example.com
    Port               9200
    HTTP_User          admin
    HTTP_Passwd        ${OPENSEARCH_PASSWORD}
    tls                On
    tls.verify         On
    tls.ca_file        /certs/root-ca.pem
    Logstash_Format    Off
    Suppress_Type_Name On
    Retry_Limit        5
[OUTPUT]
    Match              wf.admin
    Index              webfilter-admin
    Name               opensearch
    Host               node-0.example.com
    Port               9200
    HTTP_User          admin
    HTTP_Passwd        ${OPENSEARCH_PASSWORD}
    tls                On
    tls.verify         On
    tls.ca_file        /certs/root-ca.pem
    Logstash_Format    Off
    Suppress_Type_Name On
    Retry_Limit        5
[OUTPUT]
    Match              wf.access
    Index              webfilter-access
    Name               opensearch
    Host               node-0.example.com
    Port               9200
    HTTP_User          admin
    HTTP_Passwd        ${OPENSEARCH_PASSWORD}
    tls                On
    tls.verify         On
    tls.ca_file        /certs/root-ca.pem
    Logstash_Format    Off
    Suppress_Type_Name On
    Retry_Limit        5
