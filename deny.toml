# cargo-deny config. The schema evolves: in Phase 0 run `cargo deny check`, fix any schema/version
# complaints, and record the change in docs/DECISIONS_ADDENDUM.md.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# A-45: rsa rc via yara-x (optional `yara` feature, public-key verification only); see .cargo/audit.toml.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "yara-x only verifies signatures with public keys; optional feature" },
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained (no vulnerability); only via yara-x, optional feature" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0"]
confidence-threshold = 0.9
# webpki-roots ships Mozilla's CA list under a permissive data license (D-20, A-16); allowed for that crate only.
exceptions = [{ crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# rustls only (D-19): no OpenSSL-based TLS in the dependency tree
# ring is the only crypto provider (D-19, PF-0-10): no aws-lc
deny = [{ crate = "openssl" }, { crate = "openssl-sys" }, { crate = "native-tls" },
        { crate = "aws-lc-rs" }, { crate = "aws-lc-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
