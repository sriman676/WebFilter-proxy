[package]
name = "webfilter"
version = "1.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Multi-threaded filtering HTTP/HTTPS proxy and client"
publish = false

[lib]
name = "webfilter"
path = "src/lib.rs"

[[bin]]
name = "webfilter-proxy"
path = "src/bin/webfilter-proxy.rs"

[[bin]]
name = "webfilter-client"
path = "src/bin/webfilter-client.rs"

[features]
default = []
# TEST ONLY (D-20, D-44). Must never be enabled in release builds; CI asserts this.
insecure-test = []
# Optional YARA scanning (Phase 10, D-54).
yara = ["dep:yara-x"]
# Optional WASM rule plugins (Phase 14, A-30): wasmtime with fuel/memory limits, no imports.
plugins = ["dep:wasmtime"]

# Dependencies: add with `cargo add` in Phase 0 from the approved list (docs/DECISIONS.md D-27),
# then record the resolved versions in docs/ENVIRONMENT.md.

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"   # NEVER "abort": per-connection panic isolation requires unwinding (SPEC 9)

[dependencies]
arc-swap = "1.9.3"
argon2 = "0.6.0"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
h2 = "0.4.20"
hmac = "0.13.0"
hex = "0.4.3"
http = "1.5.0"
http-body-util = "0.1.5"
httparse = "1.10.1"
httpdate = "1.0.3"
hyper = { version = "1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
idna = "1.1.0"
ipnet = "2.12.2"
lol_html = "3.0.3"
moka = { version = "0.12.16", features = ["sync"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rcgen = { version = "0.14.10", features = ["x509-parser"] }
regex = "1.13.1"
regex-automata = "0.4.18"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1.8"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v7"] }
webpki-roots = "1.0.11"
yara-x = { version = "1.23.0", optional = true }
wasmtime = { version = "50.0.1", optional = true, default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
zeroize = "1.9.1"

# SO_ORIGINAL_DST for transparent mode (D-27, D-41); Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["socket", "net"] }

[dev-dependencies]
hyper = { version = "1.12.0", features = ["server", "http1"] }
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "rt-multi-thread", "macros"] }
x509-parser = "0.18.1"
