# cargo-fuzz package (D-03). Built only with the dated nightly in docs/ENVIRONMENT.md.
# `libfuzzer-sys` is added by scripts/bootstrap_deps.sh (`cargo add`), never written from memory.
[package]
name = "webfilter-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
url = "2.5.8"
webfilter = { path = ".." }

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalize"
path = "fuzz_targets/normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blocklist_parse"
path = "fuzz_targets/blocklist_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "naming"
path = "fuzz_targets/naming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_head"
path = "fuzz_targets/request_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response_head"
path = "fuzz_targets/response_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunked_codec"
path = "fuzz_targets/chunked_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_url"
path = "fuzz_targets/client_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redirect_location"
path = "fuzz_targets/redirect_location.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_hello"
path = "fuzz_targets/client_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h2_frames"
path = "fuzz_targets/h2_frames.rs"
test = false
doc = false
bench = false

# Separate workspace so the main package never builds fuzz code.
[workspace]
members = ["."]
