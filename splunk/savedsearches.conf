[WebFilter - Top Blocked Domains (24h)]
search = index=webfilter event_type=request action=blocked earliest=-24h | stats count by dest_host rule_id | sort -count | head 20
enableSched = 0

[WebFilter - Clients With High Block Rate]
search = index=webfilter event_type=request earliest=-1h | stats count as total count(eval(action="blocked")) as blocked by src_ip | eval pct=round(blocked/total*100,1) | where blocked>=10 AND pct>=30 | sort -blocked
enableSched = 1
cron_schedule = */15 * * * *

[WebFilter - Possible Beaconing]
search = index=webfilter event_type=request earliest=-4h | sort 0 src_ip dest_host _time | streamstats current=f last(_time) as prev by src_ip dest_host | eval delta=_time-prev | stats count avg(delta) as avg stdev(delta) as sd by src_ip dest_host | where count>20 AND sd<(avg*0.1) | sort -count
enableSched = 0

[WebFilter - Suspicious Long Hostnames]
search = index=webfilter event_type=request earliest=-24h | eval len=len(dest_host) | where len>40 | stats count dc(src_ip) as clients by dest_host | sort -count
enableSched = 0

[WebFilter - Smuggling or Malformed Request Attempts]
search = index=webfilter event_type=request reason IN ("invalid_request","parser_differential") earliest=-1h | stats count dc(uri_path) as paths by src_ip | where count>=5 | sort -count
enableSched = 1
cron_schedule = */10 * * * *

[WebFilter - SSRF and Port Abuse Attempts]
search = index=webfilter event_type=request reason IN ("private_range","port_not_allowed","loop_detected") earliest=-1h | stats count values(dest_host) as targets by src_ip | where count>=3 | sort -count
enableSched = 1
cron_schedule = */10 * * * *

[WebFilter - Proxy Auth Failures]
search = index=webfilter event_type=request reason IN ("auth_failed","rate_limited") earliest=-1h | stats count by src_ip proxy_user | where count>=5 | sort -count
enableSched = 1
cron_schedule = */10 * * * *

[WebFilter - TLS Anomalies (SNI/Host mismatch, bad upstream certs)]
search = index=webfilter event_type=request reason IN ("sni_mismatch","host_mismatch","upstream_cert_invalid","non_tls_on_connect") earliest=-24h | stats count by src_ip dest_host reason | sort -count
enableSched = 0

[WebFilter - Suspicious Encoding Evasion]
search = index=webfilter event_type=request suspicious_encoding=true earliest=-24h | stats count by src_ip dest_host | sort -count
enableSched = 0

[WebFilter - Log Pipeline Health]
search = index=webfilter sourcetype="webfilter:json" event_type=system kind IN ("log_dropped","blocklist_reload_failed","ca_permission_error","panic_isolated") earliest=-24h | stats count by kind
enableSched = 0

[WebFilter - Rate Limited or Over-Quota Clients]
search = index=webfilter event_type=request reason IN ("rate_limited","quota_exceeded","too_many_connections") earliest=-1h | stats count by client_id profile reason | where count>=10 | sort -count
enableSched = 1
cron_schedule = */10 * * * *

[WebFilter - Malware Detections and Unscannable Downloads]
search = index=webfilter event_type=request scan_status IN ("infected","blocklisted","unscannable","error") earliest=-24h | stats count values(download_name) as files by client_id dest_host scan_status scan_signature | sort -count
enableSched = 1
cron_schedule = */15 * * * *

[WebFilter - Threat Feed Hits]
search = index=webfilter event_type=request reason IN ("feed_domain","feed_url","feed_ip") earliest=-24h | stats count by client_id dest_host rule_list | sort -count
enableSched = 1
cron_schedule = */15 * * * *

[WebFilter - Feed Pipeline Health]
search = index=webfilter event_type=system kind IN ("feed_failed","feed_rejected","feed_stale") earliest=-24h | stats count latest(_time) as last by kind detail.name
enableSched = 0

[WebFilter - Access Requests]
search = index=webfilter event_type=access_request earliest=-24h | stats latest(status) as status by request_id client_id host | sort status
enableSched = 0

[WebFilter - Admin Actions and Auth Failures]
search = index=webfilter event_type=admin earliest=-24h | stats count by actor action result remote_addr | sort -count
enableSched = 1
cron_schedule = */30 * * * *

