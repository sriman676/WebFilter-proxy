# Place on the Universal Forwarder (or local Splunk); fix the path. Monitors request, system, stats, admin and access logs;
# rotated files (.1, .2 ...) are excluded by the whitelist.
[monitor:///path/to/webfilter-proxy/logs]
whitelist = webfilter(_system|_stats|_admin|_access)?\.jsonl$
index = webfilter
sourcetype = webfilter:json
disabled = false
