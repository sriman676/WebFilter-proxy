[webfilter:json]
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
TZ = UTC
SHOULD_LINEMERGE = false
TRUNCATE = 0
# CIM Web aliases
FIELDALIAS-cim_src = src_ip AS src
FIELDALIAS-cim_dest = dest_host AS dest
FIELDALIAS-cim_ua = user_agent AS http_user_agent
FIELDALIAS-cim_action = action AS action_cim
